config:
  target: "http://localhost:3000"

  plugins:
    ensure: {}

  phases:
    - duration: 20
      arrivalRate: 5
      name: "1. Fase de Calentamiento"

    - duration: 30
      arrivalRate: 15
      rampTo: 50
      name: "2. Fase de Saturación Máxima"

  ensure:
    thresholds:
      - "http.response_time.p99": 200

    maxErrorRate: 1

scenarios:
  - name: "Inundación transaccional perimetral (Payloads Mixtos Zod)"

    flow:
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Andrés Mendoza"
            cargo: "Software Architect"
            departamento: "I+D"
            sueldo: 4200

          capture:
            json: "$.data._id"
            as: "employeeId"

      - think: 1

      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500
